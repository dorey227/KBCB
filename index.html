<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>CutTrack</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <style>
    * { box-sizing: border-box; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
    body { margin: 0; padding: 12px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; font-family: -apple-system, 'Helvetica Neue', system-ui, sans-serif; background: #0d0d0d; }
    .app { max-width: 900px; width: 100%; border-radius: 28px; padding: 20px 16px 28px; position: relative; background: #1a1a1a; border: 1px solid #2a2a2a; color: #eee; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #2a2a2a; }
    .header h1 { font-weight: 700; font-size: 1.8rem; margin: 0; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; color: #eee; }
    .header h1 small { font-size: 0.85rem; font-weight: 400; opacity: 0.6; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; padding: 6px 8px; border-radius: 40px; transition: 0.2s; opacity: 0.7; color: #ccc; }
    .icon-btn:hover { opacity: 1; transform: scale(1.05); }
    .sync-status { font-size: 0.7rem; padding: 4px 10px; border-radius: 30px; margin-right: 4px; }
    .sync-status.online { background: rgba(100,200,130,0.15); color: #6ad48a; border: 1px solid rgba(100,200,130,0.2); }
    .sync-status.offline { background: rgba(255,100,100,0.15); color: #ff6b6b; border: 1px solid rgba(255,100,100,0.2); }
    
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .tab-btn { border: none; padding: 10px 16px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; flex: 1 0 auto; text-align: center; background: #2a2a2a; color: #888; }
    .tab-btn.active { background: #f5a623; color: #0d0d0d; box-shadow: 0 4px 16px rgba(245, 166, 35, 0.25); }
    .tab-btn:active { transform: scale(0.96); }
    .tab-content { display: none; animation: fade 0.2s ease; }
    .tab-content.active { display: block; }
    @keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }
    
    .card { background: #222; border-radius: 20px; padding: 16px; border: 1px solid #2a2a2a; margin-bottom: 14px; }
    .card-title { font-weight: 700; font-size: 1.1rem; color: #f5a623; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: #2a2a2a; }
    
    .btn { border: none; padding: 8px 16px; border-radius: 40px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; gap: 5px; }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: #f5a623; color: #0d0d0d; box-shadow: 0 4px 12px rgba(245, 166, 35, 0.3); }
    .btn-outline { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.25); color: #e0e0e0; }
    .btn-danger { background: rgba(255,100,100,0.1); border: 1px solid rgba(255,100,100,0.3); color: #ff6b6b; }
    .btn-ai { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-weight: 700; }
    .btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 5px 12px; font-size: 0.75rem; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; color: #ccc; }
    .form-control { width: 100%; padding: 12px 16px; border-radius: 40px; border: 1px solid #333; background: #1a1a1a; color: #eee; font-size: 1rem; outline: none; }
    .form-control:focus { border-color: #f5a623; box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15); }
    .form-control::placeholder { color: #555; }
    
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat-box { background: #1a1a1a; border-radius: 14px; padding: 12px 14px; border: 1px solid #2a2a2a; }
    .stat-box .label { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-box .value { font-size: 1.4rem; font-weight: 700; color: #f5a623; margin-top: 4px; }
    .stat-box .sub { font-size: 0.75rem; color: #888; margin-top: 2px; }
    
    .warning-banner { background: rgba(255,100,100,0.1); border: 1px solid rgba(255,100,100,0.3); border-radius: 14px; padding: 12px 16px; color: #ff8888; font-size: 0.85rem; margin-bottom: 14px; line-height: 1.4; }
    .warning-banner strong { color: #ff6b6b; }
    
    .progress-bar { height: 10px; background: #1a1a1a; border-radius: 10px; overflow: hidden; margin: 6px 0; border: 1px solid #2a2a2a; }
    .progress-bar .fill { height: 100%; background: linear-gradient(90deg, #f5a623, #ffd93d); transition: width 0.4s ease; }
    
    .meal-item { display: flex; gap: 12px; padding: 12px; background: #1a1a1a; border-radius: 14px; margin-bottom: 10px; border: 1px solid #2a2a2a; align-items: flex-start; }
    .meal-check { width: 26px; height: 26px; min-width: 26px; border-radius: 8px; border: 2px solid #444; background: #222; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 0.9rem; margin-top: 2px; }
    .meal-check.done { background: #2d7a4a; border-color: #2d7a4a; color: white; }
    .meal-info { flex: 1; }
    .meal-name { font-weight: 600; font-size: 0.95rem; color: #eee; margin-bottom: 3px; }
    .meal-time { font-size: 0.72rem; color: #888; margin-bottom: 4px; }
    .meal-desc { font-size: 0.82rem; color: #aaa; line-height: 1.4; }
    .meal-macros { font-size: 0.72rem; color: #f5a623; margin-top: 5px; font-weight: 600; }
    
    .log-entry { display: flex; justify-content: space-between; padding: 10px 14px; background: #1a1a1a; border-radius: 12px; margin-bottom: 8px; border: 1px solid #2a2a2a; font-size: 0.85rem; }
    .log-entry .left { color: #ccc; }
    .log-entry .right { color: #f5a623; font-weight: 600; }
    
    .weight-chart { width: 100%; height: 140px; margin: 10px 0; }
    
    .flash-message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 14px 28px; border-radius: 16px; font-size: 1rem; font-weight: 700; z-index: 9999; box-shadow: 0 8px 30px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.2s ease; pointer-events: none; text-align: center; max-width: 90%; }
    .flash-message.show { opacity: 1; }
    .flash-message.success { background: #2d7a4a; color: white; }
    .flash-message.error { background: #7a2d2d; color: white; }
    .flash-message.ai { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    
    .settings-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .settings-overlay.open { display: flex; }
    .settings-panel { max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 28px; padding: 28px 24px 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); background: #1f1f1f; color: #eee; border: 1px solid #2a2a2a; }
    .settings-panel h2 { margin-top: 0; margin-bottom: 20px; font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; justify-content: space-between; }
    .settings-panel h2 .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.6; padding: 0 4px; color: #ccc; }
    
    .empty-state { text-align: center; padding: 30px 10px; font-size: 0.9rem; color: #555; }
    .inline-input { display: flex; gap: 8px; }
    .inline-input input { flex: 1; }
    
    .ai-loading { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .habit-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #1a1a1a; border-radius: 12px; margin-bottom: 8px; border: 1px solid #2a2a2a; }
    .habit-label { font-size: 0.9rem; color: #ddd; }
    .habit-buttons { display: flex; gap: 6px; }
    .habit-btn { border: 1px solid #444; background: #222; color: #888; padding: 6px 12px; border-radius: 30px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; font-weight: 600; }
    .habit-btn.active { background: #f5a623; color: #0d0d0d; border-color: #f5a623; }
    
    .plan-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; margin-left: 6px; }
    .plan-badge.training { background: rgba(100,150,255,0.15); color: #8ab4f5; }
    .plan-badge.rest { background: rgba(150,150,150,0.15); color: #999; }
    .plan-badge.work { background: rgba(100,200,130,0.15); color: #6ad48a; }
  </style>
</head>
<body>
<div class="app" id="app">
  
  <div class="header">
    <h1>✂️ CutTrack <small id="headerSub">body recomposition</small></h1>
    <div class="header-actions">
      <span class="sync-status" id="syncStatus">🔌 connecting</span>
      <button class="icon-btn" id="settingsToggle">⚙️</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="today">📅 Today</button>
    <button class="tab-btn" data-tab="plan">🍽️ Meal Plan</button>
    <button class="tab-btn" data-tab="progress">📈 Progress</button>
    <button class="tab-btn" data-tab="log">📝 Log</button>
  </div>

  <!-- TODAY TAB -->
  <div id="tab-today" class="tab-content active">
    <div id="todayContent"></div>
  </div>

  <!-- MEAL PLAN TAB -->
  <div id="tab-plan" class="tab-content">
    <div id="planContent"></div>
  </div>

  <!-- PROGRESS TAB -->
  <div id="tab-progress" class="tab-content">
    <div id="progressContent"></div>
  </div>

  <!-- LOG TAB -->
  <div id="tab-log" class="tab-content">
    <div id="logContent"></div>
  </div>

</div>

<!-- Settings overlay -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h2>
      ⚙️ Profile Settings
      <button class="close-btn" id="settingsClose">✕</button>
    </h2>
    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" class="form-control" id="birthDate" value="1998-02-04">
    </div>
    <div class="form-group">
      <label>Height (cm)</label>
      <input type="number" class="form-control" id="heightCm" placeholder="175">
    </div>
    <div class="form-group">
      <label>Current Weight (kg)</label>
      <input type="number" step="0.1" class="form-control" id="weightKg" placeholder="80">
    </div>
    <div class="form-group">
      <label>Sex</label>
      <select class="form-control" id="sex">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    <div class="form-group">
      <label>Activity Level</label>
      <select class="form-control" id="activity">
        <option value="1.2">Sedentary (desk job, no exercise)</option>
        <option value="1.375">Light (greenkeeper-type movement, no gym)</option>
        <option value="1.55" selected>Moderate (active job + some exercise)</option>
        <option value="1.725">Very Active (hard labour / daily training)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Deficit Intensity</label>
      <select class="form-control" id="deficit">
        <option value="0.15">Gentle (15% · ~0.4 kg/wk)</option>
        <option value="0.20">Standard (20% · ~0.6 kg/wk)</option>
        <option value="0.25" selected>Aggressive (25% · ~0.8 kg/wk)</option>
        <option value="0.30">Very Aggressive (30% · ~1.0 kg/wk)</option>
      </select>
    </div>
    <div style="font-size:0.75rem; opacity:0.5; margin-bottom:14px; line-height:1.4;">
      ⚠️ The app enforces a <strong>1,500 cal/day hard floor</strong> for men (1,200 for women). If a higher deficit would drop you below that, the target is capped and a warning is shown.
    </div>
    <div class="form-group">
      <label>Training Days Per Week (gym or structured)</label>
      <input type="number" class="form-control" id="trainingDays" min="0" max="7" value="0">
    </div>
    <div class="form-group">
      <label>Foods You Won't Eat (comma-separated, optional)</label>
      <textarea class="form-control" id="dislikes" placeholder="e.g. mushrooms, cottage cheese" style="min-height:60px; border-radius:20px;"></textarea>
    </div>
    <button class="btn btn-primary" id="saveProfile" style="width:100%; justify-content:center; padding:14px;">💾 Save Profile</button>
  </div>
</div>

<script>
  // ============================================================
  // FIREBASE
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDjn72V5G3hyPoBlfzWm3N_PlgBowV8OXw",
    authDomain: "cookbook-bc019.firebaseapp.com",
    databaseURL: "https://cookbook-bc019-default-rtdb.firebaseio.com",
    projectId: "cookbook-bc019",
    storageBucket: "cookbook-bc019.firebasestorage.app",
    messagingSenderId: "879130337307",
    appId: "1:879130337307:web:66152f12488f3cded318be"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ============================================================
  // DEEPSEEK PROXY
  // ============================================================
  const PROXY_URL = "https://fatsecret-proxy-rho.vercel.app/api/fatsecret";

  async function askDeepSeek(systemPrompt, userPrompt, expectJSON = false) {
    const response = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ],
        temperature: 0.4,
        max_tokens: 2000,
        ...(expectJSON ? { response_format: { type: 'json_object' } } : {})
      })
    });
    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`AI error (${response.status}): ${errText}`);
    }
    const data = await response.json();
    return data.choices[0].message.content;
  }

  // ============================================================
  // STATE
  // ============================================================
  let profile = JSON.parse(localStorage.getItem('cuttrack_profile')) || {
    birthDate: '1998-02-04',
    heightCm: 175,
    weightKg: 80,
    sex: 'male',
    activity: '1.55',
    deficit: '0.25',
    trainingDays: 0,
    dislikes: ''
  };

  let measurements = []; // array of {date, weight, waist, neck, bf}
  let dailyLog = []; // array of {date, mealsDone: [], habits: {}, weight}
  let currentMealPlan = null; // {date, targetCal, targetProtein, meals: []}

  const todayKey = () => new Date().toISOString().slice(0, 10);

  // ============================================================
  // NAVY BODY FAT CALC
  // ============================================================
  function calculateNavyBF(sex, heightCm, waistCm, neckCm, hipCm) {
    // US Navy method
    // Male: 86.010 * log10(waist - neck) - 70.041 * log10(height) + 36.76
    // Female: 163.205 * log10(waist + hip - neck) - 97.684 * log10(height) - 78.387
    const log10 = Math.log10;
    if (sex === 'male') {
      if (!waistCm || !neckCm) return null;
      const diff = waistCm - neckCm;
      if (diff <= 0) return null;
      return Math.max(2, Math.min(50, 86.010 * log10(diff) - 70.041 * log10(heightCm) + 36.76));
    } else {
      if (!waistCm || !neckCm || !hipCm) return null;
      const sum = waistCm + hipCm - neckCm;
      if (sum <= 0) return null;
      return Math.max(8, Math.min(60, 163.205 * log10(sum) - 97.684 * log10(heightCm) - 78.387));
    }
  }

  function calculateAge(birthDate) {
    const today = new Date();
    const bd = new Date(birthDate);
    let age = today.getFullYear() - bd.getFullYear();
    const m = today.getMonth() - bd.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < bd.getDate())) age--;
    return age;
  }

  // ============================================================
  // TDEE ENGINE
  // ============================================================
  function computeTargets() {
    const age = calculateAge(profile.birthDate);
    const h = parseFloat(profile.heightCm);
    const w = parseFloat(profile.weightKg);
    const a = parseFloat(profile.activity);
    const deficit = parseFloat(profile.deficit);
    const sex = profile.sex;

    // Mifflin-St Jeor
    let bmr;
    if (sex === 'male') {
      bmr = 10 * w + 6.25 * h - 5 * age + 5;
    } else {
      bmr = 10 * w + 6.25 * h - 5 * age - 161;
    }

    const tdee = Math.round(bmr * a);
    const rawTarget = Math.round(tdee * (1 - deficit));

    // Hard floor
    const floor = sex === 'male' ? 1500 : 1200;
    const targetCal = Math.max(rawTarget, floor);
    const floorHit = rawTarget < floor;

    // Protein: 2.2g per kg of current body weight (or lean mass if BF known)
    const protein = Math.round(w * 2.2);
    const fat = Math.round((targetCal * 0.25) / 9); // 25% of cals from fat
    const carbs = Math.round((targetCal - protein * 4 - fat * 9) / 4);

    // Estimated weekly loss
    const weeklyDeficit = (tdee - targetCal) * 7;
    const weeklyLossKg = (weeklyDeficit / 7700).toFixed(2); // 1kg fat ≈ 7700 cal

    return { bmr: Math.round(bmr), tdee, targetCal, floorHit, floor, protein, fat, carbs, weeklyLossKg, age };
  }

  // ============================================================
  // FIREBASE LISTENERS
  // ============================================================
  db.collection('measurements').orderBy('date', 'asc').onSnapshot((snap) => {
    measurements = [];
    snap.forEach(d => measurements.push({ id: d.id, ...d.data() }));
    render();
  });

  db.collection('dailyLog').orderBy('date', 'asc').onSnapshot((snap) => {
    dailyLog = [];
    snap.forEach(d => dailyLog.push({ id: d.id, ...d.data() }));
    render();
  });

  db.collection('mealPlan').orderBy('date', 'desc').limit(1).onSnapshot((snap) => {
    if (!snap.empty) {
      currentMealPlan = { id: snap.docs[0].id, ...snap.docs[0].data() };
    } else {
      currentMealPlan = null;
    }
    render();
  });

  // ============================================================
  // RENDER DISPATCHER
  // ============================================================
  function render() {
    renderToday();
    renderPlan();
    renderProgress();
    renderLog();
  }

  // ============================================================
  // TODAY TAB
  // ============================================================
  function renderToday() {
    const t = computeTargets();
    const today = todayKey();
    const log = dailyLog.find(l => l.date === today) || { mealsDone: [], habits: {}, weight: null };
    const mealsDone = (log.mealsDone || []).length;
    const totalMeals = currentMealPlan?.meals?.length || 0;
    const pct = totalMeals ? Math.round((mealsDone / totalMeals) * 100) : 0;

    let warning = '';
    if (t.floorHit) {
      warning = `<div class="warning-banner">
        <strong>⚠️ Floor Hit</strong><br>
        Your requested deficit would put you at <strong>${Math.round(t.tdee * (1 - parseFloat(profile.deficit)))} cal</strong>. 
        The app has capped you at the safe minimum of <strong>${t.floor} cal/day</strong>. 
        Don't override this — going below is where you lose muscle and feel terrible.
      </div>`;
    }

    document.getElementById('todayContent').innerHTML = `
      ${warning}
      
      <div class="stat-grid">
        <div class="stat-box">
          <div class="label">🔥 Target Calories</div>
          <div class="value">${t.targetCal}</div>
          <div class="sub">TDEE ${t.tdee} · BMR ${t.bmr}</div>
        </div>
        <div class="stat-box">
          <div class="label">💪 Protein Goal</div>
          <div class="value">${t.protein}g</div>
          <div class="sub">2.2g per kg bodyweight</div>
        </div>
        <div class="stat-box">
          <div class="label">🍞 Carbs · 🥑 Fat</div>
          <div class="value" style="font-size:1.1rem;">${t.carbs}g · ${t.fat}g</div>
          <div class="sub">remaining after protein</div>
        </div>
        <div class="stat-box">
          <div class="label">📉 Projected Loss</div>
          <div class="value">${t.weeklyLossKg}kg</div>
          <div class="sub">per week at this rate</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📋 Today's Plan</div>
        ${totalMeals === 0 ? `
          <div class="empty-state">
            No meal plan yet.<br><br>
            <button class="btn btn-ai" onclick="document.querySelector('[data-tab=plan]').click()">🍽️ Generate One</button>
          </div>
        ` : `
          <div style="font-size:0.85rem; color:#888; margin-bottom:10px;">
            ${mealsDone} of ${totalMeals} meals done · ${pct}%
          </div>
          <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
        `}
      </div>

      <div class="card">
        <div class="card-title">✅ Daily Habits</div>
        ${renderHabits(log)}
      </div>

      <div class="card">
        <div class="card-title">⚖️ Morning Weigh-In</div>
        <div class="inline-input">
          <input type="number" step="0.1" class="form-control" id="quickWeight" placeholder="80.0" value="${log.weight || ''}">
          <button class="btn btn-primary" onclick="saveQuickWeight()">Save kg</button>
        </div>
        <div style="font-size:0.7rem; color:#666; margin-top:6px;">
          Weigh first thing, after toilet, before eating. Daily fluctuations are water — look at the 7-day trend.
        </div>
      </div>
    `;
  }

  function renderHabits(log) {
    const habits = [
      { key: 'weighed', label: '⚖️ Weighed in' },
      { key: 'protein', label: '💪 Hit protein goal' },
      { key: 'water', label: '💧 2L+ water' },
      { key: 'steps', label: '🚶 8k+ steps' },
      { key: 'sleep', label: '😴 7+ hrs sleep' },
      { key: 'noSnack', label: '🚫 No unplanned snacks' }
    ];
    return habits.map(h => {
      const done = log.habits?.[h.key];
      return `
        <div class="habit-row">
          <div class="habit-label">${h.label}</div>
          <div class="habit-buttons">
            <button class="habit-btn ${done ? 'active' : ''}" onclick="toggleHabit('${h.key}')">
              ${done ? '✓ Done' : 'Mark'}
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  // ============================================================
  // PLAN TAB
  // ============================================================
  function renderPlan() {
    const t = computeTargets();
    if (!currentMealPlan) {
      document.getElementById('planContent').innerHTML = `
        <div class="card">
          <div class="card-title">🍽️ AI Meal Plan</div>
          <div style="font-size:0.85rem; color:#aaa; margin-bottom:14px; line-height:1.5;">
            DeepSeek will generate a plan targeting <strong style="color:#f5a623;">${t.targetCal} cal</strong> and 
            <strong style="color:#f5a623;">${t.protein}g protein</strong> per day.
            ${t.floorHit ? '<br><br><span style="color:#ff8888;">⚠️ Your deficit is capped by the safety floor.</span>' : ''}
          </div>
          <button class="btn btn-ai" id="genPlanBtn" style="width:100%; justify-content:center; padding:14px;">
            ✨ Generate My Meal Plan
          </button>
        </div>
      `;
      document.getElementById('genPlanBtn').addEventListener('click', generateMealPlan);
      return;
    }

    const meals = currentMealPlan.meals || [];
    const today = todayKey();
    const log = dailyLog.find(l => l.date === today) || { mealsDone: [] };
    const mealsDone = log.mealsDone || [];

    document.getElementById('planContent').innerHTML = `
      <div class="card">
        <div class="card-title">🎯 Targets</div>
        <div class="stat-grid" style="margin-bottom:0;">
          <div class="stat-box"><div class="label">Calories</div><div class="value">${currentMealPlan.targetCal}</div></div>
          <div class="stat-box"><div class="label">Protein</div><div class="value">${currentMealPlan.targetProtein}g</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🍽️ Your Meals (${meals.length})</div>
        ${meals.map((m, i) => {
          const done = mealsDone.includes(i);
          return `
            <div class="meal-item">
              <div class="meal-check ${done ? 'done' : ''}" onclick="toggleMeal(${i})">${done ? '✓' : ''}</div>
              <div class="meal-info">
                <div class="meal-name">${m.name}</div>
                <div class="meal-time">${m.time || ''} ${m.badge ? `<span class="plan-badge ${m.badgeType || 'rest'}">${m.badge}</span>` : ''}</div>
                <div class="meal-desc">${m.description || ''}</div>
                ${m.macros ? `<div class="meal-macros">${m.macros}</div>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="card">
        <div class="card-title">💡 Notes</div>
        <div style="font-size:0.85rem; color:#aaa; line-height:1.5;">${currentMealPlan.notes || 'No notes.'}</div>
      </div>

      <button class="btn btn-outline" id="regenPlanBtn" style="width:100%; justify-content:center; padding:12px;">
        🔄 Regenerate Plan
      </button>
    `;
    document.getElementById('regenPlanBtn').addEventListener('click', () => {
      if (confirm('Regenerate the plan? This will replace the current one.')) generateMealPlan();
    });
  }

  async function generateMealPlan() {
    const btn = document.getElementById('genPlanBtn');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="ai-loading">⏳</span> Thinking...';
    }

    try {
      const t = computeTargets();
      const dislikes = profile.dislikes ? `\nFoods to AVOID: ${profile.dislikes}` : '';
      const trainingNote = profile.trainingDays > 0
        ? `\nHe trains ${profile.trainingDays} days per week. Add extra carbs on training days.`
        : `\nNo structured training — moderate carbs, high protein.`;
      const jobNote = `\nHe works as a greenkeeper (on feet Mon-Fri, physical movement).`;

      const systemPrompt = `You are an evidence-based sports nutritionist. Generate a daily meal plan as strict JSON.
Return ONLY valid JSON in this exact format:
{
  "targetCal": number,
  "targetProtein": number,
  "meals": [
    {
      "name": "Meal name",
      "time": "7:30 AM",
      "description": "What to eat, specific foods and rough quantities",
      "macros": "500 cal · 40g P · 45g C · 15g F",
      "badge": "Pre-work | Post-work | Work day | Rest | etc",
      "badgeType": "training | rest | work"
    }
  ],
  "notes": "2-3 sentences of practical advice for him"
}`;

      const userPrompt = `Generate a meal plan for:
- Male, ${t.age} years old, 175cm, ${profile.weightKg}kg
- Target: ${t.targetCal} cal/day, ${t.targetProtein}g protein/day
- Deficit: ${profile.deficit * 100}% below maintenance
- 4-5 meals per day, simple whole foods, Australian supermarket ingredients${dislikes}${trainingNote}${jobNote}

Keep meals realistic and quick to prepare (he's busy). Use foods like chicken, beef mince, eggs, greek yogurt, rice, oats, potatoes, broccoli, spinach, etc.
Return JSON only.`;

      const response = await askDeepSeek(systemPrompt, userPrompt, true);
      const clean = response.replace(/```json\n?|\n?```/g, '').trim();
      const plan = JSON.parse(clean);

      // Save to Firestore
      const planData = {
        date: todayKey(),
        targetCal: plan.targetCal || t.targetCal,
        targetProtein: plan.targetProtein || t.protein,
        meals: plan.meals || [],
        notes: plan.notes || '',
        createdAt: new Date().toISOString()
      };

      // Delete old plan if exists
      const old = await db.collection('mealPlan').get();
      const batch = db.batch();
      old.forEach(doc => batch.delete(doc.ref));
      batch.set(db.collection('mealPlan').doc(), planData);
      await batch.commit();

      showFlash('✨ Meal plan ready!', 'ai');
    } catch (error) {
      console.error('Plan error:', error);
      showFlash('❌ ' + error.message.substring(0, 60), 'error');
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '✨ Generate My Meal Plan';
      }
    }
  }

  // ============================================================
  // PROGRESS TAB
  // ============================================================
  function renderProgress() {
    const t = computeTargets();
    const sorted = [...measurements].sort((a, b) => a.date.localeCompare(b.date));
    
    // 7-day rolling avg weight
    const recent = sorted.slice(-7);
    const rollingAvg = recent.length ? (recent.reduce((s, m) => s + m.weight, 0) / recent.length).toFixed(1) : null;
    
    // Trend (last 7 vs previous 7)
    let trend = null;
    if (sorted.length >= 14) {
      const last7 = sorted.slice(-7).reduce((s, m) => s + m.weight, 0) / 7;
      const prev7 = sorted.slice(-14, -7).reduce((s, m) => s + m.weight, 0) / 7;
      trend = (last7 - prev7).toFixed(2);
    }

    const latestBF = sorted.length ? sorted[sorted.length - 1].bf : null;
    const startWeight = sorted.length ? sorted[0].weight : profile.weightKg;
    const lostKg = (startWeight - profile.weightKg).toFixed(1);

    let chartSvg = '<div class="empty-state">Log a few weigh-ins to see your trend.</div>';
    if (sorted.length >= 2) {
      chartSvg = buildWeightChart(sorted);
    }

    document.getElementById('progressContent').innerHTML = `
      <div class="stat-grid">
        <div class="stat-box">
          <div class="label">Current Weight</div>
          <div class="value">${profile.weightKg}kg</div>
          <div class="sub">7-day avg: ${rollingAvg || '—'}kg</div>
        </div>
        <div class="stat-box">
          <div class="label">Total Lost</div>
          <div class="value">${lostKg}kg</div>
          <div class="sub">since tracking began</div>
        </div>
        <div class="stat-box">
          <div class="label">Est. Body Fat</div>
          <div class="value">${latestBF ? latestBF.toFixed(1) + '%' : '—'}</div>
          <div class="sub">Navy tape method</div>
        </div>
        <div class="stat-box">
          <div class="label">Weekly Trend</div>
          <div class="value">${trend ? (trend > 0 ? '+' : '') + trend + 'kg' : '—'}</div>
          <div class="sub">last 7 vs prev 7</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📈 Weight Trend</div>
        <div class="weight-chart">${chartSvg}</div>
      </div>

      <div class="card">
        <div class="card-title">📏 New Measurement</div>
        <div style="font-size:0.8rem; color:#888; margin-bottom:12px;">
          Use a soft tape measure. Keep it level, snug but not compressing. Same time of day each week.
        </div>
        <div class="form-group">
          <label>Weight (kg)</label>
          <input type="number" step="0.1" class="form-control" id="mWeight" value="${profile.weightKg}">
        </div>
        <div class="form-group">
          <label>Waist (cm) — at navel</label>
          <input type="number" step="0.1" class="form-control" id="mWaist" placeholder="e.g. 88">
        </div>
        <div class="form-group">
          <label>Neck (cm) — just below larynx</label>
          <input type="number" step="0.1" class="form-control" id="mNeck" placeholder="e.g. 38">
        </div>
        ${profile.sex === 'female' ? `
        <div class="form-group">
          <label>Hip (cm) — widest point</label>
          <input type="number" step="0.1" class="form-control" id="mHip" placeholder="e.g. 95">
        </div>` : ''}
        <button class="btn btn-primary" onclick="saveMeasurement()" style="width:100%; justify-content:center; padding:12px;">
          💾 Save Measurement
        </button>
      </div>
    `;
  }

  function buildWeightChart(sorted) {
    const w = 320, h = 120, pad = 10;
    const weights = sorted.map(m => m.weight);
    const min = Math.min(...weights) - 1;
    const max = Math.max(...weights) + 1;
    const range = max - min || 1;
    const stepX = (w - pad * 2) / Math.max(1, sorted.length - 1);
    
    const points = sorted.map((m, i) => {
      const x = pad + i * stepX;
      const y = h - pad - ((m.weight - min) / range) * (h - pad * 2);
      return `${x},${y}`;
    }).join(' ');
    
    const dots = sorted.map((m, i) => {
      const x = pad + i * stepX;
      const y = h - pad - ((m.weight - min) / range) * (h - pad * 2);
      return `<circle cx="${x}" cy="${y}" r="3" fill="#f5a623"/>`;
    }).join('');
    
    return `
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%; height:100%;">
        <polyline points="${points}" fill="none" stroke="#f5a623" stroke-width="2" stroke-linejoin="round"/>
        ${dots}
      </svg>
    `;
  }

  async function saveMeasurement() {
    const weight = parseFloat(document.getElementById('mWeight').value);
    const waist = parseFloat(document.getElementById('mWaist').value);
    const neck = parseFloat(document.getElementById('mNeck').value);
    const hipEl = document.getElementById('mHip');
    const hip = hipEl ? parseFloat(hipEl.value) : null;

    if (!weight) { showFlash('⚠️ Enter weight', 'error'); return; }

    let bf = null;
    if (waist && neck) {
      bf = calculateNavyBF(profile.sex, parseFloat(profile.heightCm), waist, neck, hip);
    }

    const date = todayKey();
    const existing = measurements.find(m => m.date === date);
    
    const data = {
      date,
      weight,
      waist: waist || null,
      neck: neck || null,
      hip: hip || null,
      bf,
      createdAt: new Date().toISOString()
    };

    if (existing) {
      await db.collection('measurements').doc(existing.id).update(data);
    } else {
      await db.collection('measurements').add(data);
    }

    // Update profile weight
    profile.weightKg = weight;
    localStorage.setItem('cuttrack_profile', JSON.stringify(profile));

    showFlash(bf ? `✅ Saved · ${bf.toFixed(1)}% BF` : '✅ Saved!', 'success');
  }

  // ============================================================
  // LOG TAB
  // ============================================================
  function renderLog() {
    const sorted = [...dailyLog].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 30);
    
    if (!sorted.length) {
      document.getElementById('logContent').innerHTML = `
        <div class="empty-state">No log yet. Start with the Today tab.</div>
      `;
      return;
    }

    document.getElementById('logContent').innerHTML = `
      <div class="card">
        <div class="card-title">📝 Recent Days</div>
        ${sorted.map(d => {
          const meals = (d.mealsDone || []).length;
          const habits = Object.values(d.habits || {}).filter(Boolean).length;
          return `
            <div class="log-entry">
              <div class="left">${d.date} ${d.weight ? `· ${d.weight}kg` : ''}</div>
              <div class="right">${meals} meals · ${habits}/6 habits</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // ============================================================
  // ACTIONS
  // ============================================================
  async function toggleHabit(key) {
    const today = todayKey();
    const existing = dailyLog.find(l => l.date === today);
    const habits = existing ? { ...existing.habits } : {};
    habits[key] = !habits[key];

    if (existing) {
      await db.collection('dailyLog').doc(existing.id).update({ habits });
    } else {
      await db.collection('dailyLog').add({
        date: today,
        habits,
        mealsDone: [],
        createdAt: new Date().toISOString()
      });
    }
  }

  async function toggleMeal(idx) {
    const today = todayKey();
    const existing = dailyLog.find(l => l.date === today);
    let mealsDone = existing ? [...(existing.mealsDone || [])] : [];

    if (mealsDone.includes(idx)) {
      mealsDone = mealsDone.filter(i => i !== idx);
    } else {
      mealsDone.push(idx);
    }

    if (existing) {
      await db.collection('dailyLog').doc(existing.id).update({ mealsDone });
    } else {
      await db.collection('dailyLog').add({
        date: today,
        mealsDone,
        habits: {},
        createdAt: new Date().toISOString()
      });
    }
  }

  async function saveQuickWeight() {
    const w = parseFloat(document.getElementById('quickWeight').value);
    if (!w) { showFlash('⚠️ Enter weight', 'error'); return; }
    
    const today = todayKey();
    const existing = dailyLog.find(l => l.date === today);
    
    if (existing) {
      await db.collection('dailyLog').doc(existing.id).update({ weight: w });
    } else {
      await db.collection('dailyLog').add({
        date: today,
        weight: w,
        habits: {},
        mealsDone: [],
        createdAt: new Date().toISOString()
      });
    }

    // Also save as measurement
    const existingM = measurements.find(m => m.date === today);
    if (existingM) {
      await db.collection('measurements').doc(existingM.id).update({ weight: w });
    } else {
      await db.collection('measurements').add({
        date: today,
        weight: w,
        createdAt: new Date().toISOString()
      });
    }

    profile.weightKg = w;
    localStorage.setItem('cuttrack_profile', JSON.stringify(profile));

    showFlash('✅ Weight saved!', 'success');
  }

  function showFlash(msg, type) {
    const flash = document.createElement('div');
    flash.className = 'flash-message ' + (type || 'success');
    flash.textContent = msg;
    document.body.appendChild(flash);
    setTimeout(() => flash.classList.add('show'), 10);
    setTimeout(() => {
      flash.classList.remove('show');
      setTimeout(() => flash.remove(), 300);
    }, 1200);
  }

  // ============================================================
  // TABS
  // ============================================================
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
      btn.classList.add('active');
    });
  });

  // ============================================================
  // SETTINGS
  // ============================================================
  document.getElementById('settingsToggle').addEventListener('click', () => {
    document.getElementById('birthDate').value = profile.birthDate;
    document.getElementById('heightCm').value = profile.heightCm;
    document.getElementById('weightKg').value = profile.weightKg;
    document.getElementById('sex').value = profile.sex;
    document.getElementById('activity').value = profile.activity;
    document.getElementById('deficit').value = profile.deficit;
    document.getElementById('trainingDays').value = profile.trainingDays;
    document.getElementById('dislikes').value = profile.dislikes;
    document.getElementById('settingsOverlay').classList.add('open');
  });

  document.getElementById('settingsClose').addEventListener('click', () => {
    document.getElementById('settingsOverlay').classList.remove('open');
  });

  document.getElementById('settingsOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('settingsOverlay')) {
      document.getElementById('settingsOverlay').classList.remove('open');
    }
  });

  document.getElementById('saveProfile').addEventListener('click', () => {
    profile.birthDate = document.getElementById('birthDate').value;
    profile.heightCm = document.getElementById('heightCm').value;
    profile.weightKg = document.getElementById('weightKg').value;
    profile.sex = document.getElementById('sex').value;
    profile.activity = document.getElementById('activity').value;
    profile.deficit = document.getElementById('deficit').value;
    profile.trainingDays = parseInt(document.getElementById('trainingDays').value) || 0;
    profile.dislikes = document.getElementById('dislikes').value;
    localStorage.setItem('cuttrack_profile', JSON.stringify(profile));
    document.getElementById('settingsOverlay').classList.remove('open');
    showFlash('✅ Profile saved', 'success');
    render();
  });

  // ============================================================
  // INIT
  // ============================================================
  render();
  console.log('✂️ CutTrack loaded');
</script>
</body>
</html>
