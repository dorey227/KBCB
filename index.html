<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>KBCB</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <style>
    * { box-sizing: border-box; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
    body { margin: 0; padding: 12px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; font-family: -apple-system, 'Helvetica Neue', system-ui, sans-serif; background: #0d0d0d; }
    .app { max-width: 900px; width: 100%; border-radius: 28px; padding: 20px 16px 28px; position: relative; background: #1a1a1a; border: 1px solid #2a2a2a; color: #eee; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #2a2a2a; }
    .header h1 { font-weight: 700; font-size: 1.8rem; margin: 0; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; color: #eee; }
    .header h1 small { font-size: 0.85rem; font-weight: 400; opacity: 0.6; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; padding: 6px 8px; border-radius: 40px; transition: 0.2s; opacity: 0.7; color: #ccc; }
    .icon-btn:hover { opacity: 1; transform: scale(1.05); }
    .sync-status { font-size: 0.7rem; padding: 4px 10px; border-radius: 30px; margin-right: 4px; }
    .sync-status.online { background: rgba(100,200,130,0.15); color: #6ad48a; border: 1px solid rgba(100,200,130,0.2); }
    .sync-status.offline { background: rgba(255,100,100,0.15); color: #ff6b6b; border: 1px solid rgba(255,100,100,0.2); }
    .sync-status.syncing { background: rgba(245,166,35,0.15); color: #f5a623; border: 1px solid rgba(245,166,35,0.2); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .tab-btn { border: none; padding: 10px 18px; border-radius: 40px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s; flex: 1 0 auto; text-align: center; background: #2a2a2a; color: #888; }
    .tab-btn.active { background: #f5a623; color: #0d0d0d; box-shadow: 0 4px 16px rgba(245, 166, 35, 0.25); }
    .tab-btn:active { transform: scale(0.96); }
    .tab-content { display: none; animation: fade 0.2s ease; }
    .tab-content.active { display: block; }
    @keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }
    
    /* ===== RECIPE CARDS ===== */
    .recipe-grid { display: flex; flex-direction: column; gap: 14px; }
    .recipe-card { background: #222; border-radius: 20px; padding: 16px; border: 1px solid #2a2a2a; cursor: pointer; transition: 0.15s; }
    .recipe-card:active { transform: scale(0.99); }
    .recipe-title { font-weight: 700; font-size: 1.2rem; margin: 0 0 4px 0; color: #eee; }
    .recipe-meta { font-size: 0.7rem; color: #666; margin-bottom: 6px; }
    
    .recipe-img-wrapper { width: 100%; margin: 10px 0 12px 0; border-radius: 14px; overflow: hidden; border: 1px solid #2f2f2f; background: #1a1a1a; position: relative; }
    .recipe-img-wrapper img { width: 100%; height: auto; max-height: 350px; display: block; object-fit: cover; }
    .recipe-img-wrapper .ratio-controls { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 4px; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 20px; opacity: 0; transition: opacity 0.3s ease; }
    .recipe-card:hover .ratio-controls, .recipe-card:active .ratio-controls { opacity: 1; }
    .recipe-img-wrapper .ratio-controls button { background: none; border: none; color: #ccc; padding: 2px 6px; border-radius: 12px; font-size: 0.65rem; cursor: pointer; transition: 0.2s; }
    .recipe-img-wrapper .ratio-controls button:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .recipe-img-wrapper .ratio-controls button.active { background: rgba(245,166,35,0.3); color: #f5a623; }
    
    .recipe-img-placeholder { width: 100%; height: 150px; background: #1a1a1a; border-radius: 14px; margin: 10px 0 12px 0; display: flex; align-items: center; justify-content: center; color: #555; font-size: 0.85rem; border: 1px dashed #333; }
    .ingredient-list { list-style: none; padding: 0; margin: 8px 0 6px 0; display: flex; flex-wrap: wrap; gap: 6px 10px; }
    .ingredient-list li { background: #2a2a2a; padding: 4px 14px; border-radius: 30px; font-size: 0.85rem; color: #bbb; border: 1px solid #333; }
    .macros-display { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0 4px; padding: 10px 14px; background: #1a1a1a; border-radius: 14px; font-size: 0.85rem; border: 1px solid #2a2a2a; }
    .macros-display span { font-weight: 500; color: #888; }
    .macros-display .macro-value { color: #f5a623; font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; border-top: 1px solid #2a2a2a; padding-top: 12px; }
    
    .btn { border: none; padding: 6px 16px; border-radius: 40px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; gap: 5px; }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: #f5a623; color: #0d0d0d; box-shadow: 0 4px 12px rgba(245, 166, 35, 0.3); }
    .btn-primary:active { opacity: 0.8; }
    .btn-outline { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.25); color: #e0e0e0; }
    .btn-danger { background: rgba(255,100,100,0.1); border: 1px solid rgba(255,100,100,0.3); color: #ff6b6b; }
    .btn-auto { background: rgba(100,150,255,0.1); border: 1px solid rgba(100,150,255,0.3); color: #8ab4f5; }
    .empty-state { text-align: center; padding: 40px 10px; font-size: 1rem; color: #555; }
    
    /* ===== FORMS ===== */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
    .form-control { width: 100%; padding: 12px 16px; border-radius: 40px; border: 1px solid #333; background: #1a1a1a; color: #eee; font-size: 1rem; transition: 0.15s; outline: none; }
    .form-control:focus { border-color: #f5a623; box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15); }
    .form-control::placeholder { color: #555; }
    textarea.form-control { border-radius: 20px; resize: vertical; min-height: 70px; font-family: inherit; }
    .ingredient-input-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .ingredient-input-group input { flex: 2; min-width: 120px; }
    .chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
    .chip { background: #2a2a2a; padding: 4px 14px; border-radius: 30px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #ccc; border: 1px solid #333; }
    .chip .remove { cursor: pointer; font-weight: 700; color: #888; font-size: 1rem; }
    .chip .remove:hover { color: #d45a5a; }
    
    .macros-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .macro-input-group { display: flex; align-items: center; gap: 8px; }
    .macro-input-group label { min-width: 50px; font-weight: 600; margin: 0; color: #aaa; font-size: 0.85rem; }
    .macro-input-group input { flex: 1; padding: 8px 12px; border-radius: 30px; border: 1px solid #333; background: #1a1a1a; color: #eee; font-size: 0.95rem; width: 80px; outline: none; }
    .macro-input-group input:focus { border-color: #f5a623; box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15); }
    .macro-auto-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
    .macro-auto-row .btn { padding: 8px 16px; }
    .auto-progress { font-size: 0.8rem; color: #8ab4f5; margin-left: 8px; }
    
    /* ===== SHOPPING ===== */
    .shopping-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #2a2a2a; }
    .shopping-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: #f5a623; cursor: pointer; }
    .shopping-item .item-name { flex: 1; font-size: 0.95rem; color: #ddd; }
    .shopping-item .item-source { font-size: 0.75rem; color: #555; }
    .shopping-item input:checked + .item-name { text-decoration: line-through; color: #555; }
    .footer-bar { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; justify-content: space-between; }
    
    #fileInput { display: none; }
    .photo-upload-area { border: 2px dashed #333; border-radius: 18px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; background: #1a1a1a; }
    .photo-upload-area:active { transform: scale(0.98); }
    .photo-upload-area.has-image { border-color: #f5a623; background: #1f1a12; }
    .photo-upload-area div { color: #666; font-size: 0.9rem; }
    .photo-preview { max-height: 200px; border-radius: 14px; margin-top: 10px; display: none; width: 100%; object-fit: cover; }
    .photo-preview.show { display: block; }
    
    .inline-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .edit-hint { color: #444; font-size: 0.7rem; }
    .form-title { color: #eee; font-weight: 700; font-size: 1.3rem; margin-top: 0; margin-bottom: 16px; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-group .btn { flex: 1; justify-content: center; padding: 14px; font-size: 1rem; }
    
    /* ===== SETTINGS ===== */
    .settings-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .settings-overlay.open { display: flex; }
    .settings-panel { max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 28px; padding: 28px 24px 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); animation: slideUp 0.3s ease; background: #1f1f1f; color: #eee; border: 1px solid #2a2a2a; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .settings-panel h2 { margin-top: 0; margin-bottom: 20px; font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; justify-content: space-between; }
    .settings-panel h2 .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.6; padding: 0 4px; color: #ccc; }
    .settings-group { margin-bottom: 18px; }
    .settings-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; opacity: 0.8; }
    .settings-group .desc { font-size: 0.75rem; opacity: 0.5; margin-bottom: 6px; }
    .settings-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .color-option { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
    .color-option:hover { transform: scale(1.1); }
    .color-option.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.3); }
    .font-option { padding: 6px 16px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); cursor: pointer; font-size: 0.9rem; transition: 0.2s; color: #ccc; }
    .font-option:hover { background: rgba(255,255,255,0.1); }
    .font-option.active { border-color: #f5a623; background: rgba(245, 166, 35, 0.15); }
    .settings-actions { display: flex; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
    .settings-actions .btn { flex: 1; justify-content: center; padding: 12px; font-size: 0.95rem; }
    .settings-group input[type="range"] { width: 100%; accent-color: #f5a623; }
    .color-hex-input { display: flex; gap: 8px; align-items: center; }
    .color-hex-input input[type="color"] { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; background: none; padding: 0; }
    .color-hex-input input[type="text"] { flex: 1; padding: 8px 12px; border-radius: 30px; border: 1px solid #333; font-size: 0.9rem; background: #1a1a1a; color: #eee; }
    
    .sharing-info { background: rgba(245,166,35,0.08); border: 1px solid rgba(245,166,35,0.15); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.8rem; color: #aaa; }
    .sharing-info strong { color: #f5a623; }
    
    /* ===== RECIPE DETAIL VIEW ===== */
    .detail-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0d0d0d; z-index: 1500; overflow-y: auto; }
    .detail-overlay.open { display: block; }
    .detail-container { max-width: 900px; margin: 0 auto; padding: 0 0 100px 0; min-height: 100vh; background: #1a1a1a; }
    .detail-top-bar { position: sticky; top: 0; background: #1a1a1a; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; z-index: 10; }
    .detail-top-bar .btn-close { background: none; border: none; color: #eee; font-size: 1.3rem; cursor: pointer; padding: 6px 12px; border-radius: 40px; transition: 0.2s; }
    .detail-top-bar .btn-close:hover { background: rgba(255,255,255,0.1); }
    .detail-top-bar .btn-edit { background: #f5a623; color: #0d0d0d; border: none; padding: 8px 20px; border-radius: 40px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .detail-top-bar .btn-edit:hover { transform: scale(1.05); }
    .detail-body { padding: 0 20px; }
    .detail-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 20px; margin: 20px 0; border: 1px solid #2a2a2a; }
    .detail-title { font-size: 2rem; font-weight: 700; color: #eee; margin: 10px 0 4px 0; }
    .detail-meta { font-size: 0.85rem; color: #666; margin-bottom: 20px; }
    .detail-section-title { font-size: 1.1rem; font-weight: 700; color: #f5a623; margin: 24px 0 12px 0; display: flex; align-items: center; gap: 8px; }
    .detail-section-title::after { content: ''; flex: 1; height: 1px; background: #2a2a2a; }
    
    /* ===== TICKABLE INGREDIENTS ===== */
    .tickable-ingredient { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #222; border: 1px solid #2a2a2a; border-radius: 14px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; user-select: none; }
    .tickable-ingredient:hover { background: #2a2a2a; border-color: #333; }
    .tickable-ingredient.added { background: rgba(100,200,130,0.1); border-color: rgba(100,200,130,0.3); }
    .tickable-ingredient .checkbox { width: 28px; height: 28px; min-width: 28px; border-radius: 8px; border: 2px solid #444; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: 0.2s; background: #1a1a1a; }
    .tickable-ingredient.added .checkbox { background: #2d7a4a; border-color: #2d7a4a; color: white; }
    .tickable-ingredient .ingredient-text { flex: 1; font-size: 0.95rem; color: #ddd; }
    .tickable-ingredient.added .ingredient-text { color: #6ad48a; }
    
    .detail-macros { display: flex; gap: 16px; flex-wrap: wrap; padding: 16px; background: #222; border-radius: 16px; border: 1px solid #2a2a2a; }
    .detail-macros span { font-size: 0.95rem; color: #888; }
    .detail-macros .value { color: #f5a623; font-weight: 700; font-size: 1.1rem; }
    
    .detail-instructions { background: #222; border-radius: 16px; padding: 20px; border: 1px solid #2a2a2a; color: #ccc; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
    .detail-instructions a { color: #f5a623; text-decoration: underline; }
    
    .detail-bottom { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .detail-bottom .btn { width: 100%; justify-content: center; padding: 16px; font-size: 1rem; border-radius: 20px; }
    
    /* ===== FLASH MESSAGES ===== */
    .flash-message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 14px 28px; border-radius: 16px; font-size: 1.1rem; font-weight: 700; z-index: 9999; box-shadow: 0 8px 30px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.2s ease; pointer-events: none; }
    .flash-message.show { opacity: 1; }
    .flash-message.success { background: #2d7a4a; color: white; }
    .flash-message.error { background: #7a2d2d; color: white; }
    
    /* ===== INSPIRATION TAB ===== */
    .inspiration-download { text-align: center; padding: 60px 20px; }
    .inspiration-download h2 { color: #eee; font-size: 1.5rem; margin-bottom: 10px; }
    .inspiration-download p { color: #888; margin-bottom: 24px; font-size: 0.95rem; line-height: 1.6; }
    .inspiration-download .btn { padding: 16px 32px; font-size: 1.1rem; }
    
    .inspiration-search { display: flex; gap: 8px; margin-bottom: 16px; }
    .inspiration-search input { flex: 1; padding: 12px 16px; border-radius: 40px; border: 1px solid #333; background: #1a1a1a; color: #eee; font-size: 1rem; outline: none; }
    .inspiration-search input:focus { border-color: #f5a623; }
    .inspiration-search button { padding: 12px 20px; }
    
    .inspiration-card { background: #222; border-radius: 20px; padding: 16px; border: 1px solid #2a2a2a; margin-bottom: 12px; display: flex; gap: 16px; align-items: center; }
    .inspiration-card img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .inspiration-card .info { flex: 1; }
    .inspiration-card .name { font-weight: 700; font-size: 1rem; color: #eee; margin-bottom: 4px; }
    .inspiration-card .category { font-size: 0.75rem; color: #666; }
    .inspiration-card .import-btn { background: #f5a623; color: #0d0d0d; border: none; padding: 8px 16px; border-radius: 40px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .inspiration-card .import-btn:hover { transform: scale(1.05); }
    .inspiration-card .import-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="app" id="app">
  
  <!-- HEADER -->
  <div class="header">
    <h1>⚔️ <span id="appTitle">KBCB</span> <small>shared</small></h1>
    <div class="header-actions">
      <span class="sync-status" id="syncStatus">🔌 connecting</span>
      <button class="icon-btn" id="settingsToggle" aria-label="Settings">⚙️</button>
    </div>
  </div>

  <!-- SHARING INFO -->
  <div class="sharing-info" id="sharingInfo">
    Add your Fav meals to share with your boyfriend XOXO
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="recipes">📖 Recipes</button>
    <button class="tab-btn" data-tab="shopping">🛒 Shopping</button>
    <button class="tab-btn" data-tab="add">➕ New</button>
    <button class="tab-btn" data-tab="inspiration">💡 Inspiration</button>
  </div>

  <!-- RECIPES TAB -->
  <div id="tab-recipes" class="tab-content active">
    <div id="recipeList" class="recipe-grid">
      <div class="empty-state">⏳ Loading recipes...</div>
    </div>
  </div>

  <!-- SHOPPING TAB -->
  <div id="tab-shopping" class="tab-content">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
      <h3 style="margin:0; color:#eee; font-weight:600; font-size:1.1rem;">🛒 Shopping list</h3>
      <button class="btn btn-outline" id="clearShoppingBtn">Clear checked</button>
    </div>
    <div id="shoppingListContainer">
      <div class="empty-state">⏳ Loading shopping list...</div>
    </div>
    <div class="footer-bar">
      <button class="btn btn-outline" id="addCustomShoppingBtn">➕ Add item</button>
    </div>
  </div>

  <!-- ADD/EDIT RECIPE TAB -->
  <div id="tab-add" class="tab-content">
    <h3 class="form-title" id="formTitle">📝 New Recipe</h3>
    <input type="hidden" id="editId" value="">

    <div class="form-group">
      <label>Recipe name *</label>
      <input class="form-control" id="recipeName" placeholder="e.g. Spaghetti aglio e olio">
    </div>

    <div class="form-group">
      <label>📸 Photo</label>
      <div class="photo-upload-area" id="photoUploadArea">
        <div id="photoUploadText">Tap to add or change photo</div>
        <input type="file" accept="image/*" id="fileInput">
        <img id="photoPreview" class="photo-preview" alt="Preview">
      </div>
    </div>

    <div class="form-group">
      <label>Ingredients *</label>
      <div class="ingredient-input-group">
        <input class="form-control" id="ingredientInput" placeholder="e.g. 200g spaghetti">
        <button class="btn btn-primary" id="addIngredientBtn">+ Add</button>
      </div>
      <div id="ingredientChips" class="chip-group"></div>
    </div>

    <div class="form-group">
      <label>📊 Macros (per serving)</label>
      <div class="macros-grid">
        <div class="macro-input-group">
          <label>🔥 Cal</label>
          <input class="form-control" id="macroCal" placeholder="0" type="number" step="1">
        </div>
        <div class="macro-input-group">
          <label>💪 Protein</label>
          <input class="form-control" id="macroProtein" placeholder="0g" type="number" step="0.1">
        </div>
        <div class="macro-input-group">
          <label>🍞 Carbs</label>
          <input class="form-control" id="macroCarbs" placeholder="0g" type="number" step="0.1">
        </div>
        <div class="macro-input-group">
          <label>🥑 Fat</label>
          <input class="form-control" id="macroFat" placeholder="0g" type="number" step="0.1">
        </div>
      </div>

  // IMAGE COMPRESSION
  // ============================================================
  function compressImage(dataUrl) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = function() {
        let width = img.width, height = img.height;
        const maxSize = 600;
        if (width > maxSize || height > maxSize) {
          if (width > height) { height = Math.round(height * (maxSize / width)); width = maxSize; }
          else { width = Math.round(width * (maxSize / height)); height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        let quality = 0.7;
        let compressed = canvas.toDataURL('image/jpeg', quality);
        let attempts = 0;
        while (compressed.length > 300 * 1024 && quality > 0.1 && attempts < 10) {
          quality -= 0.05;
          compressed = canvas.toDataURL('image/jpeg', quality);
          attempts++;
        }
        resolve(compressed);
      };
      img.src = dataUrl;
    });
  }

      return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color: #f5a623; text-decoration: underline;">${displayText}</a>`;

  async function toggleIngredient(el, ingredientName) {
    const isAdded = shoppingItems.some(s => s.name === ingredientName);
    
    if (isAdded) {
      // Remove from shopping
      const item = shoppingItems.find(s => s.name === ingredientName);
      if (item) {
        await db.collection('shopping').doc(item.id).delete();
        el.classList.remove('added');
        el.querySelector('.checkbox').textContent = '';
        showFlash('❌ Removed', 'error');
      }
    } else {
      // Add to shopping
      await db.collection('shopping').add({
        name: ingredientName,
        checked: false,
        source: 'recipe',
        createdAt: new Date().toISOString()
      });
      el.classList.add('added');
      el.querySelector('.checkbox').textContent = '✓';
      showFlash('✅ Added!', 'success');
    }
  }

        el.querySelector('.checkbox').textContent = '✓';
      } else {
        el.classList.remove('added');
        el.querySelector('.checkbox').textContent = '';

    });

  // ============================================================
  // FORM FUNCTIONS
  // ============================================================
  function resetForm() {
    recipeName.value = '';
    tempIngredients = [];
    instructionsInput.value = '';
    fileInput.value = '';
    photoPreview.classList.remove('show');
    photoPreview.src = '';
    photoUploadArea.classList.remove('has-image');
    photoUploadText.textContent = 'Tap to add or change photo';
    macroCal.value = '';
    macroProtein.value = '';
    macroCarbs.value = '';
    macroFat.value = '';
    autoProgress.textContent = '';
    editingId = null;
    editIdInput.value = '';
    formTitle.textContent = '📝 New Recipe';
    renderIngredientChips();
  }

  function loadRecipeForEdit(id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;
    editingId = id;
    editIdInput.value = id;
    formTitle.textContent = '✏️ Edit Recipe';
    recipeName.value = recipe.name || '';
    instructionsInput.value = recipe.instructions || '';
    tempIngredients = recipe.ingredients ? [...recipe.ingredients] : [];
    renderIngredientChips();
    if (recipe.image && recipe.image.startsWith('data:image')) {
      photoPreview.src = recipe.image;
      photoPreview.classList.add('show');
      photoUploadArea.classList.add('has-image');
      photoUploadText.textContent = 'Change photo';
    } else {
      photoPreview.classList.remove('show');
      photoPreview.src = '';
      photoUploadArea.classList.remove('has-image');
      photoUploadText.textContent = 'Tap to add or change photo';
    }
    if (recipe.macros) {
      macroCal.value = recipe.macros.cal || '';
      macroProtein.value = recipe.macros.protein || '';
      macroCarbs.value = recipe.macros.carbs || '';
      macroFat.value = recipe.macros.fat || '';
    }
    activateTab('add');
  }

  function parseQuantity(ingredient) {
    const match = ingredient.match(/^(\d+)\s*(g|kg|ml|l|oz|lb)?\s*(.+)/i);
    if (match) return { quantity: parseFloat(match[1]), unit: match[2]?.toLowerCase() || '', name: match[3].trim() };
    const countMatch = ingredient.match(/^(\d+)\s*(.+)/);
    if (countMatch) return { quantity: parseFloat(countMatch[1]), unit: 'count', name: countMatch[2].trim() };
    return { quantity: 100, unit: 'g', name: ingredient };
  }

  function autoCalculateMacros() {
    if (!tempIngredients.length) {
      autoProgress.textContent = '⚠️ Add ingredients first!';
      setTimeout(() => { autoProgress.textContent = ''; }, 3000);
      return;
    }
    autoProgress.textContent = '🔍 Analyzing...';
    setTimeout(() => {
      let totalCal = 0, totalProtein = 0, totalCarbs = 0, totalFat = 0;
      let matched = 0;
      tempIngredients.forEach(ing => {
        const parsed = parseQuantity(ing);
        const name = parsed.name.toLowerCase();
        let found = false;
        if (specialItems[name] || specialItems[name.replace(/s$/, '')]) {
          const key = name.replace(/s$/, '');
          const item = specialItems[key];
          const factor = parsed.quantity;
          totalCal += item.cal * factor;
          totalProtein += item.protein * factor;
          totalCarbs += item.carbs * factor;
          totalFat += item.fat * factor;
          found = true; matched++;
        } else {
          for (const [key, value] of Object.entries(foodDB)) {
            if (name.includes(key) || key.includes(name)) {
              let qty = parsed.quantity;
              const unit = parsed.unit;
              if (unit === 'kg') qty = qty * 1000;
              else if (unit === 'oz') qty = qty * 28.35;
              else if (unit === 'lb') qty = qty * 453.6;
              else if (unit === 'count' || unit === '') {
                if (name.includes('tomato')) qty = qty * 150;
                else if (name.includes('onion')) qty = qty * 150;
                else if (name.includes('garlic')) qty = qty * 5;
                else qty = 100;
              }
              const factor = qty / 100;
              totalCal += value.cal * factor;
              totalProtein += value.protein * factor;
              totalCarbs += value.carbs * factor;
              totalFat += value.fat * factor;
              found = true; matched++;
              break;
            }
          }
        }
        if (!found) {
          if (name.includes('oil') || name.includes('butter')) { totalCal += 800; totalFat += 90; }
          else if (name.includes('meat') || name.includes('chicken') || name.includes('beef')) { totalCal += 200; totalProtein += 25; totalFat += 10; }
          else if (name.includes('flour') || name.includes('sugar') || name.includes('rice') || name.includes('pasta')) { totalCal += 130; totalCarbs += 25; }
          else { totalCal += 50; totalCarbs += 5; totalProtein += 1; }
        }
      });
      macroCal.value = Math.round(totalCal);
      macroProtein.value = Math.round(totalProtein * 10) / 10;
      macroCarbs.value = Math.round(totalCarbs * 10) / 10;
      macroFat.value = Math.round(totalFat * 10) / 10;
      autoProgress.textContent = matched > 0 ? `✅ ${matched} matched` : '⚠️ Manual adjustment';
      setTimeout(() => { autoProgress.textContent = ''; }, 3000);
    }, 100);
  }

  autoMacroBtn.addEventListener('click', autoCalculateMacros);

  // ============================================================
  // SAVE RECIPE
  // ============================================================
  saveRecipeBtn.addEventListener('click', async function() {
    const name = recipeName.value.trim();
    if (!name) { alert('Please enter a recipe name.'); return; }
    if (!tempIngredients.length) { alert('Add at least one ingredient.'); return; }

    const originalText = this.textContent;
    this.textContent = '⏳ Saving...';
    this.disabled = true;

    try {
      let imageData = '';
      if (photoPreview.src && photoPreview.classList.contains('show')) {
        this.textContent = '⏳ Compressing...';
        imageData = await compressImage(photoPreview.src);
      }

      const recipeData = {
        name: name,
        ingredients: [...tempIngredients],
        instructions: instructionsInput.value.trim(),
        image: imageData,
        imageFit: 'cover',
        macros: {
          cal: parseFloat(macroCal.value) || 0,
          protein: parseFloat(macroProtein.value) || 0,
          carbs: parseFloat(macroCarbs.value) || 0,
          fat: parseFloat(macroFat.value) || 0
        },
        createdBy: '👤 Cook',
        updatedAt: new Date().toISOString()
      };

      if (editingId) {
        await db.collection('recipes').doc(editingId).update(recipeData);
      } else {
        recipeData.createdAt = new Date().toISOString();
        await db.collection('recipes').add(recipeData);
      }
      resetForm();
      activateTab('recipes');
    } catch (error) {
      alert('Error: ' + error.message);
    } finally {
      this.textContent = originalText;
      this.disabled = false;
    }
  });

  // ============================================================
  // INSPIRATION TAB
  // ============================================================
  function renderInspiration() {
    const downloaded = localStorage.getItem('cookbook_inspiration');
    
    if (!downloaded) {
      inspirationContent.innerHTML = `
        <div class="inspiration-download">
          <h2>💡 Inspiration Awaits!</h2>
          <p>Download a free cookbook with popular recipes from around the world.<br>Browse them and import your favorites into your own collection.</p>
          <button class="btn btn-primary" id="downloadCookbookBtn">📥 Download Free Cookbook</button>
        </div>
      `;
      document.getElementById('downloadCookbookBtn').addEventListener('click', downloadCookbook);
      return;
    }
    
    inspirationRecipes = JSON.parse(downloaded);
    
    inspirationContent.innerHTML = `
      <div class="inspiration-search">
        <input type="text" id="inspirationSearchInput" placeholder="Search recipes...">
        <button class="btn btn-primary" id="inspirationSearchBtn">🔍</button>
      </div>
      <div id="inspirationList"></div>
      <div class="footer-bar">
        <button class="btn btn-outline" id="redownloadBtn">🔄 Re-download Cookbook</button>
      </div>
    `;
    
    renderInspirationList(inspirationRecipes);
    
    document.getElementById('inspirationSearchBtn').addEventListener('click', searchInspiration);
    document.getElementById('inspirationSearchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchInspiration();
    });
    document.getElementById('redownloadBtn').addEventListener('click', () => {
      if (confirm('Re-download the cookbook? This will replace the current one.')) {
        localStorage.removeItem('cookbook_inspiration');
        downloadCookbook();
      }
    });
  }

  async function downloadCookbook() {
    inspirationContent.innerHTML = `<div class="inspiration-download"><h2>⏳ Downloading...</h2><p>Fetching recipes from around the world...</p></div>`;
    
    try {
      // Fetch a variety of recipes from TheMealDB
      const categories = ['Seafood', 'Chicken', 'Beef', 'Pasta', 'Vegetarian', 'Dessert', 'Pork', 'Lamb'];
      const allRecipes = [];
      
      for (const cat of categories) {
        try {
          const res = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?c=${cat}`);
          const data = await res.json();
          if (data.meals) {
            // Take first 8 from each category
            data.meals.slice(0, 8).forEach(meal => {
              if (!allRecipes.some(r => r.idMeal === meal.idMeal)) {
                allRecipes.push(meal);
              }
            });
          }
        } catch (err) { console.error('Category error:', cat, err); }
      }
      
      // Fetch full details for each recipe
      const fullRecipes = [];
      for (const meal of allRecipes) {
        try {
          const res = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${meal.idMeal}`);
          const data = await res.json();
          if (data.meals && data.meals[0]) {
            fullRecipes.push(parseMealDB(data.meals[0]));
          }
        } catch (err) { console.error('Detail error:', meal.idMeal, err); }
      }
      
      localStorage.setItem('cookbook_inspiration', JSON.stringify(fullRecipes));
      showFlash(`✅ Downloaded ${fullRecipes.length} recipes!`, 'success');
      renderInspiration();
    } catch (error) {
      console.error('Download error:', error);
      inspirationContent.innerHTML = `<div class="inspiration-download"><h2>❌ Download Failed</h2><p>${error.message}</p><button class="btn btn-primary" onclick="location.reload()">Try Again</button></div>`;
    }
  }

  function parseMealDB(meal) {
    // Extract ingredients
    const ingredients = [];
    for (let i = 1; i <= 20; i++) {
      const ing = meal['strIngredient' + i];
      const measure = meal['strMeasure' + i];
      if (ing && ing.trim()) {
        const full = measure && measure.trim() ? `${measure.trim()} ${ing.trim()}` : ing.trim();
        ingredients.push(full);
      }
    }
    
    // Extract YouTube link
    let instructions = meal.strInstructions || '';
    if (meal.strYoutube) {
      instructions += `\n\n▶️ ${meal.strYoutube}`;
    }
    
    return {
      id: 'insp_' + meal.idMeal,
      name: meal.strMeal,
      image: meal.strMealThumb,
      imageFit: 'cover',
      ingredients: ingredients,
      instructions: instructions,
      category: meal.strCategory || '',
      area: meal.strArea || '',
      macros: { cal: 0, protein: 0, carbs: 0, fat: 0 },
      createdBy: '💡 ' + (meal.strArea || 'Inspiration')
    };
  }

  function renderInspirationList(list) {
    const container = document.getElementById('inspirationList');
    if (!list.length) {
      container.innerHTML = '<div class="empty-state">No recipes found</div>';
      return;
    }
    
    container.innerHTML = list.map(r => `
      <div class="inspiration-card">
        <img src="${r.image}" alt="${r.name}" loading="lazy">
        <div class="info">
          <div class="name">${r.name}</div>
          <div class="category">${r.category} • ${r.createdBy}</div>
        </div>
        <button class="import-btn" data-id="${r.id}">➕ Import</button>
      </div>
    `).join('');
    
    document.querySelectorAll('.import-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const recipe = inspirationRecipes.find(r => r.id === btn.dataset.id);
        if (!recipe) return;
        
        btn.disabled = true;
        btn.textContent = '⏳';
        
        try {
          // Check if already imported
          const existing = recipes.find(r => r.name === recipe.name);
          if (existing) {
            showFlash('⚠️ Already in your cookbook', 'error');
            btn.textContent = '✓';
            return;
          }
          
          // Import to Firebase
          const recipeData = {
            name: recipe.name,
            ingredients: [...recipe.ingredients],
            instructions: recipe.instructions,
            image: recipe.image,
            imageFit: 'cover',
            macros: recipe.macros,
            createdBy: recipe.createdBy,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          
          await db.collection('recipes').add(recipeData);
          showFlash('✅ Imported!', 'success');
          btn.textContent = '✓';
        } catch (error) {
          console.error('Import error:', error);
          btn.disabled = false;
          btn.textContent = '➕ Import';
          showFlash('❌ Failed to import', 'error');
        }
      });
    });
  }

  function searchInspiration() {
    const query = document.getElementById('inspirationSearchInput').value.toLowerCase().trim();
    if (!query) {
      renderInspirationList(inspirationRecipes);
      return;
    }
    const filtered = inspirationRecipes.filter(r => 
      r.name.toLowerCase().includes(query) || 
      r.ingredients.some(i => i.toLowerCase().includes(query))
    );
    renderInspirationList(filtered);
  }

  // ============================================================
  // TABS
  // ============================================================
  function activateTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      activateTab(tab);
      if (tab === 'add' && !editingId) resetForm();
      if (tab === 'inspiration') renderInspiration();
    });
  });

    document.getElementById('app').style.color = isDark ? '#eee' : '#222';
    document.getElementById('app').style.borderColor = isDark ? '#2a2a2a' : '#e0d6cc';
    document.querySelectorAll('.btn-primary').forEach(el => {
      el.style.background = accent;
      el.style.color = isDark ? '#0d0d0d' : '#ffffff';
    });
    document.querySelectorAll('.macro-value').forEach(el => el.style.color = accent);
    document.querySelectorAll('.tab-btn.active').forEach(el => {
      el.style.background = accent;
      el.style.color = isDark ? '#0d0d0d' : '#ffffff';
    });
    document.querySelectorAll('.recipe-card').forEach(el => {
      el.style.background = isDark ? '#222' : '#faf8f5';
      el.style.borderColor = isDark ? '#2a2a2a' : '#e0d6cc';
    });
    document.querySelectorAll('.form-control').forEach(el => {
      el.style.background = isDark ? '#1a1a1a' : '#faf8f5';
      el.style.color = isDark ? '#eee' : '#222';
      el.style.borderColor = isDark ? '#333' : '#d5d0ca';
    });
    document.querySelector('.header').style.borderBottomColor = isDark ? '#2a2a2a' : '#e0d6cc';
    document.querySelector('.header h1').style.color = isDark ? '#eee' : '#222';
    document.querySelectorAll('.tickable-ingredient').forEach(el => {
      el.style.background = isDark ? '#222' : '#faf8f5';
      el.style.borderColor = isDark ? '#2a2a2a' : '#e0d6cc';
    });
    document.querySelectorAll('.detail-instructions').forEach(el => {
      el.style.background = isDark ? '#222' : '#faf8f5';
      el.style.color = isDark ? '#ccc' : '#333';
    });
  }

  document.querySelectorAll('.color-option').forEach(btn => {
    btn.addEventListener('click', () => {

      btn.classList.add('active');
      settings.accentColor = btn.dataset.color;
      localStorage.setItem('cookbook_settings', JSON.stringify(settings));

    });
  });

  document.getElementById('applyCustomColor').addEventListener('click', () => {
    const color = document.getElementById('customColorHex').value;

      document.querySelectorAll('.color-option').forEach(b => b.classList.remove('active'));

      document.getElementById('app').style.fontFamily = settings.fontFamily;

  });

    applySettings();
  });

  document.getElementById('radiusSlider').addEventListener('input', (e) => {

    settings.cardRadius = val;

    document.getElementById('app').style.fontSize = val + '%';

  document.getElementById('resetSettings').addEventListener('click', () => {

      settings = { accentColor: '#f5a623', fontFamily: "'Helvetica Neue', system-ui, sans-serif", cardRadius: 20, fontSize: 100, theme: 'dark' };

  document.getElementById('settingsToggle').addEventListener('click', () => {
    document.getElementById('settingsOverlay').classList.add('open');

    document.getElementById('customColorHex').value = settings.accentColor;

      document.getElementById('settingsOverlay').classList.remove('open');
    }
  });

  // ============================================================

  applySettings();

  document.querySelectorAll('.color-option').forEach(el => {

  document.querySelectorAll('.font-option').forEach(el => {

  });

  console.log('⚔️ KBCB - Detail View + Inspiration loaded!');
</script>
