  // ============================================================
  // 🔥 STRONG IMAGE COMPRESSION
  // ============================================================
  function compressImage(dataUrl, maxWidth = 800, maxHeight = 800, quality = 0.7) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = function() {
        let width = img.width;
        let height = img.height;
        
        // Resize to max 800px
        if (width > maxWidth || height > maxHeight) {
          if (width > height) {
            height = height * (maxWidth / width);
            width = maxWidth;
          } else {
            width = width * (maxHeight / height);
            height = maxHeight;
          }
        }
        
        // Draw on canvas
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(width);
        canvas.height = Math.round(height);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        // Compress with quality
        let compressed = canvas.toDataURL('image/jpeg', quality);
        
        // Keep reducing quality until under 700KB
        let currentQuality = quality;
        const targetSize = 700 * 1024;
        let attempts = 0;
        
        while (compressed.length > targetSize && currentQuality > 0.1 && attempts < 10) {
          currentQuality -= 0.1;
          compressed = canvas.toDataURL('image/jpeg', currentQuality);
          attempts++;
        }
        
        // If STILL too big, resize even smaller
        if (compressed.length > targetSize) {
          const smallerCanvas = document.createElement('canvas');
          const smallerSize = 500;
          let w = canvas.width;
          let h = canvas.height;
          if (w > smallerSize || h > smallerSize) {
            if (w > h) {
              h = h * (smallerSize / w);
              w = smallerSize;
            } else {
              w = w * (smallerSize / h);
              h = smallerSize;
            }
          }
          smallerCanvas.width = Math.round(w);
          smallerCanvas.height = Math.round(h);
          const smallerCtx = smallerCanvas.getContext('2d');
          smallerCtx.drawImage(canvas, 0, 0, smallerCanvas.width, smallerCanvas.height);
          compressed = smallerCanvas.toDataURL('image/jpeg', 0.5);
        }
        
        resolve(compressed);
      };
      img.src = dataUrl;
    });
  }

  function renderRecipes() {
    if (!recipes.length) {
      recipeListEl.innerHTML = `<div class="empty-state">🍽️ No recipes yet. Add your first!</div>`;
      return;
    }
    let html = '';
    recipes.forEach((r) => {
      let imgHtml = '';
      if (r.image && r.image.startsWith('data:image')) {
        const fitMode = r.imageFit || 'cover';
        imgHtml = `
          <div class="recipe-img-wrapper">
            <img src="${r.image}" alt="${r.name}" style="object-fit: ${fitMode};">
            <div class="ratio-controls">
              <button class="${fitMode === 'cover' ? 'active' : ''}" data-id="${r.id}" data-fit="cover">📐</button>
              <button class="${fitMode === 'contain' ? 'active' : ''}" data-id="${r.id}" data-fit="contain">📏</button>
              <button class="${fitMode === 'auto' ? 'active' : ''}" data-id="${r.id}" data-fit="auto">🔄</button>
            </div>
          </div>
        `;
      } else {
        imgHtml = `<div class="recipe-img-placeholder">📸 No photo</div>`;
      }

        ? `<ul class="ingredient-list">${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>`
        : '<div style="opacity:0.4; font-size:0.85rem;">No ingredients</div>';
      
      let macrosHtml = '';
      if (r.macros && (r.macros.cal || r.macros.protein || r.macros.carbs || r.macros.fat)) {
        macrosHtml = `
          <div class="macros-display">
            <span>🔥 <span class="macro-value">${r.macros.cal || 0}</span> cal</span>
            <span>💪 <span class="macro-value">${r.macros.protein || 0}</span>g</span>
            <span>🍞 <span class="macro-value">${r.macros.carbs || 0}</span>g</span>
            <span>🥑 <span class="macro-value">${r.macros.fat || 0}</span>g</span>
          </div>
        `;
      }
      
      const createdBy = r.createdBy ? `👤 ${r.createdBy}` : '';
      
      html += `
        <div class="recipe-card" data-id="${r.id}">
          <div class="recipe-header">
            <div>
              <div class="recipe-title">${r.name}</div>
              <div class="recipe-meta">${createdBy}</div>
            </div>
            <div class="inline-actions">
              <button class="btn btn-outline edit-recipe-btn" data-id="${r.id}">✏️ Edit</button>
              <button class="btn btn-outline add-to-shopping-btn" data-id="${r.id}">🛒 + list</button>
              <button class="btn btn-danger delete-recipe-btn" data-id="${r.id}">✕</button>
            </div>
          </div>
          ${imgHtml}
          ${ingredientsHtml}
          ${macrosHtml}
          ${r.instructions ? `<div style="margin-top:8px; opacity:0.7; white-space:pre-wrap; font-size:0.9rem;">${r.instructions}</div>` : ''}
          <div class="actions">
            <span style="font-size:0.75rem; opacity:0.4;">${r.ingredients ? r.ingredients.length : 0} ingredients</span>
            <span class="edit-hint">👆 Tap card to edit</span>
          </div>
        </div>
      `;
    });
    recipeListEl.innerHTML = html;

    // Ratio control buttons
    document.querySelectorAll('.ratio-controls button').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const fit = btn.dataset.fit;
        const wrapper = btn.closest('.recipe-img-wrapper');
        const img = wrapper.querySelector('img');
        img.style.objectFit = fit;
        wrapper.querySelectorAll('.ratio-controls button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        try {
          await db.collection('recipes').doc(id).update({ imageFit: fit });
        } catch (error) {
          console.error('Error saving image fit:', error);
        }
      });
    });

    document.querySelectorAll('.recipe-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        const id = card.dataset.id;
        loadRecipeForEdit(id);
      });
    });

    document.querySelectorAll('.edit-recipe-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        loadRecipeForEdit(btn.dataset.id);
      });
    });

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        if (confirm('Delete this recipe?')) {
          db.collection('recipes').doc(id).delete();
        }
      });
    });

    document.querySelectorAll('.add-to-shopping-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {

        if (recipe && recipe.ingredients) {
          recipe.ingredients.forEach(ing => {
            db.collection('shopping').add({
              name: ing,
              checked: false,
              source: recipe.name,
              createdAt: new Date().toISOString()
            });
          });
        }
      });
    });
  }

  function renderShopping() {
    if (!shoppingItems.length) {
      shoppingContainer.innerHTML = `<div class="empty-state">🛒 Your shopping list is empty.</div>`;
      return;
    }
    let html = '';
    shoppingItems.forEach((item) => {
      const checked = item.checked ? 'checked' : '';
      html += `
        <div class="shopping-item" data-id="${item.id}">
          <input type="checkbox" ${checked} class="shopping-checkbox">
          <span class="item-name">${item.name}</span>
          <span class="item-source">${item.source ? '📖 ' + item.source : ''}</span>
          <button class="btn btn-danger" style="padding:2px 12px; font-size:0.75rem;" data-shopping-id="${item.id}">✕</button>
        </div>
      `;
    });
    shoppingContainer.innerHTML = html;

    document.querySelectorAll('.shopping-checkbox').forEach((cb) => {
      const id = cb.closest('.shopping-item').dataset.id;
      cb.addEventListener('change', (e) => {
        db.collection('shopping').doc(id).update({ checked: cb.checked });
      });
    });

    document.querySelectorAll('[data-shopping-id]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = btn.dataset.shoppingId;
        db.collection('shopping').doc(id).delete();
      });
    });
  }

  // FORM FUNCTIONS
  // ============================================================

  function resetForm() {
    recipeName.value = '';
    tempIngredients = [];
    instructionsInput.value = '';
    fileInput.value = '';
    photoPreview.classList.remove('show');
    photoPreview.src = '';
    photoUploadArea.classList.remove('has-image');
    photoUploadText.textContent = 'Tap to add or change photo';
    macroCal.value = '';
    macroProtein.value = '';
    macroCarbs.value = '';
    macroFat.value = '';
    autoProgress.textContent = '';
    editingId = null;
    editIdInput.value = '';
    formTitle.textContent = '📝 New Recipe';
    renderIngredientChips();
  }

  function loadRecipeForEdit(id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;
    
    editingId = id;
    editIdInput.value = id;
    formTitle.textContent = '✏️ Edit Recipe';
    
    recipeName.value = recipe.name || '';
    instructionsInput.value = recipe.instructions || '';
    
    tempIngredients = recipe.ingredients ? [...recipe.ingredients] : [];
    renderIngredientChips();
    
    if (recipe.image && recipe.image.startsWith('data:image')) {
      photoPreview.src = recipe.image;
      photoPreview.classList.add('show');
      photoUploadArea.classList.add('has-image');
      photoUploadText.textContent = 'Change photo';
    } else {
      photoPreview.classList.remove('show');
      photoPreview.src = '';
      photoUploadArea.classList.remove('has-image');
      photoUploadText.textContent = 'Tap to add or change photo';
    }
    
    if (recipe.macros) {
      macroCal.value = recipe.macros.cal || '';
      macroProtein.value = recipe.macros.protein || '';
      macroCarbs.value = recipe.macros.carbs || '';
      macroFat.value = recipe.macros.fat || '';
    } else {
      macroCal.value = '';
      macroProtein.value = '';
      macroCarbs.value = '';
      macroFat.value = '';
    }
    
    activateTab('add');
  }

  function parseQuantity(ingredient) {
    const match = ingredient.match(/^(\d+)\s*(g|kg|ml|l|oz|lb)?\s*(.+)/i);
    if (match) {
      return { quantity: parseFloat(match[1]), unit: match[2]?.toLowerCase() || '', name: match[3].trim() };
    }
    const countMatch = ingredient.match(/^(\d+)\s*(.+)/);
    if (countMatch) {
      return { quantity: parseFloat(countMatch[1]), unit: 'count', name: countMatch[2].trim() };
    }
    return { quantity: 100, unit: 'g', name: ingredient };
  }

  function autoCalculateMacros() {
    if (!tempIngredients.length) {
      autoProgress.textContent = '⚠️ Add ingredients first!';
      setTimeout(() => { autoProgress.textContent = ''; }, 3000);
      return;
    }

    autoProgress.textContent = '🔍 Analyzing...';
    setTimeout(() => {
      let totalCal = 0, totalProtein = 0, totalCarbs = 0, totalFat = 0;
      let matched = 0;

      tempIngredients.forEach(ing => {
        const parsed = parseQuantity(ing);
        const name = parsed.name.toLowerCase();
        let found = false;

        if (specialItems[name] || specialItems[name.replace(/s$/, '')]) {
          const key = name.replace(/s$/, '');
          const item = specialItems[key];
          const factor = parsed.quantity;
          totalCal += item.cal * factor;
          totalProtein += item.protein * factor;
          totalCarbs += item.carbs * factor;
          totalFat += item.fat * factor;
          found = true;
          matched++;
        } else {
          for (const [key, value] of Object.entries(foodDB)) {
            if (name.includes(key) || key.includes(name)) {
              let qty = parsed.quantity;
              const unit = parsed.unit;
              if (unit === 'kg') qty = qty * 1000;
              else if (unit === 'oz') qty = qty * 28.35;
              else if (unit === 'lb') qty = qty * 453.6;
              else if (unit === 'count' || unit === '') {
                if (name.includes('tomato')) qty = qty * 150;
                else if (name.includes('onion')) qty = qty * 150;
                else if (name.includes('garlic')) qty = qty * 5;
                else qty = 100;
              }
              const factor = qty / 100;
              totalCal += value.cal * factor;
              totalProtein += value.protein * factor;
              totalCarbs += value.carbs * factor;
              totalFat += value.fat * factor;
              found = true;
              matched++;
              break;
            }
          }
        }

        if (!found) {
          if (name.includes('oil') || name.includes('butter')) {
            totalCal += 800; totalFat += 90;
          } else if (name.includes('meat') || name.includes('chicken') || name.includes('beef')) {
            totalCal += 200; totalProtein += 25; totalFat += 10;
          } else if (name.includes('flour') || name.includes('sugar') || name.includes('rice') || name.includes('pasta')) {
            totalCal += 130; totalCarbs += 25;
          } else {
            totalCal += 50; totalCarbs += 5; totalProtein += 1;
          }
        }
      });

      macroCal.value = Math.round(totalCal);
      macroProtein.value = Math.round(totalProtein * 10) / 10;
      macroCarbs.value = Math.round(totalCarbs * 10) / 10;
      macroFat.value = Math.round(totalFat * 10) / 10;

      autoProgress.textContent = matched > 0 ? `✅ ${matched} ingredients matched` : '⚠️ Manual adjustment recommended';
      setTimeout(() => { autoProgress.textContent = ''; }, 3000);
    }, 100);
  }

  autoMacroBtn.addEventListener('click', autoCalculateMacros);

  // ============================================================
  // SAVE RECIPE (with STRONGER compression)
  // ============================================================

  saveRecipeBtn.addEventListener('click', async () => {
    const name = recipeName.value.trim();
    if (!name) { alert('Please enter a recipe name.'); return; }
    if (!tempIngredients.length) { alert('Add at least one ingredient.'); return; }

    const originalText = saveRecipeBtn.textContent;
    saveRecipeBtn.textContent = '⏳ Compressing...';
    saveRecipeBtn.disabled = true;

    try {
      let compressedImage = '';
      if (photoPreview.src && photoPreview.classList.contains('show')) {
        // Compress to max 800px, quality 0.7
        compressedImage = await compressImage(photoPreview.src, 800, 800, 0.7);
        
        // If still too large, try even smaller
        if (compressedImage.length > 800 * 1024) {
          compressedImage = await compressImage(photoPreview.src, 600, 600, 0.5);
        }
        
        // Last resort - very small
        if (compressedImage.length > 800 * 1024) {
          compressedImage = await compressImage(photoPreview.src, 400, 400, 0.4);
        }
      }

      const recipeData = {
        name: name,
        ingredients: [...tempIngredients],
        instructions: instructionsInput.value.trim(),
        image: compressedImage,
        imageFit: 'cover',
        macros: {
          cal: parseFloat(macroCal.value) || 0,
          protein: parseFloat(macroProtein.value) || 0,
          carbs: parseFloat(macroCarbs.value) || 0,
          fat: parseFloat(macroFat.value) || 0
        },
        createdBy: '👤 Cook',
        updatedAt: new Date().toISOString()
      };

      if (editingId) {
        await db.collection('recipes').doc(editingId).update(recipeData);
      } else {
        recipeData.createdAt = new Date().toISOString();
        await db.collection('recipes').add(recipeData);
      }
      
      resetForm();
      activateTab('recipes');
    } catch (error) {
      alert('Error saving recipe: ' + error.message);
    } finally {
      saveRecipeBtn.textContent = originalText;
      saveRecipeBtn.disabled = false;
    }
  });

  // ============================================================
  // INGREDIENTS
  // ============================================================

  function renderIngredientChips() {
    ingredientChips.innerHTML = tempIngredients.map((ing, i) => 
      `<span class="chip">${ing} <span class="remove" data-ing-index="${i}">✕</span></span>`
    ).join('');
    document.querySelectorAll('.chip .remove').forEach(el => {
      el.addEventListener('click', (e) => {
        const idx = parseInt(el.dataset.ingIndex);
        tempIngredients.splice(idx, 1);
        renderIngredientChips();
      });
    });
  }

  addIngredientBtn.addEventListener('click', () => {
    const val = ingredientInput.value.trim();
    if (val) {
      tempIngredients.push(val);
      ingredientInput.value = '';
      renderIngredientChips();
    }
  });
  ingredientInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addIngredientBtn.click(); }
  });

  // ============================================================
  // PHOTO UPLOAD (with size warning)
  // ============================================================

  photoUploadArea.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      if (file.size > 3 * 1024 * 1024) {
        alert('⚠️ This image is ' + Math.round(file.size/1024/1024) + 'MB.\nIt will be compressed automatically.');
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        photoPreview.src = ev.target.result;
        photoPreview.classList.add('show');
        photoUploadArea.classList.add('has-image');
        photoUploadText.textContent = 'Change photo';
      };
      reader.readAsDataURL(file);
    }
  });

  cancelEditBtn.addEventListener('click', () => {
    if (editingId) {
      if (confirm('Cancel editing? Changes will be lost.')) {
        resetForm();
        activateTab('recipes');
      }
    } else {
      resetForm();
      activateTab('recipes');
    }
  });

  // ============================================================
  // SHOPPING ACTIONS
  // ============================================================

  document.getElementById('clearShoppingBtn').addEventListener('click', () => {
    const checkedItems = shoppingItems.filter(item => item.checked);
    if (checkedItems.length) {
      if (confirm(`Clear ${checkedItems.length} checked items?`)) {
        checkedItems.forEach(item => {
          db.collection('shopping').doc(item.id).delete();
        });
      }
    }
  });

  document.getElementById('addCustomShoppingBtn').addEventListener('click', () => {
    const itemName = prompt('Enter item name:');
    if (itemName && itemName.trim()) {
      db.collection('shopping').add({
        name: itemName.trim(),
        checked: false,
        source: 'manual',
        createdAt: new Date().toISOString()
      });
    }
  });

  // ============================================================
  // TABS
  // ============================================================

  function activateTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      activateTab(tab);
      if (tab === 'add' && !editingId) resetForm();
    });
  });

  // ============================================================
  // SETTINGS
  // ============================================================

  function applySettings() {
    const isDark = settings.theme === 'dark';
    const accent = settings.accentColor;
    
    document.body.style.background = isDark ? '#0d0d0d' : '#f5f0eb';
    document.getElementById('app').style.background = isDark ? '#1a1a1a' : '#ffffff';
    document.getElementById('app').style.color = isDark ? '#eee' : '#222';
    document.getElementById('app').style.borderColor = isDark ? '#2a2a2a' : '#e0d6cc';
    
    document.querySelectorAll('.btn-primary').forEach(el => {
      el.style.background = accent;
      el.style.color = isDark ? '#0d0d0d' : '#ffffff';
      el.style.boxShadow = `0 4px 12px ${accent}44`;
    });
    
    document.querySelectorAll('.macro-value').forEach(el => el.style.color = accent);
    document.querySelectorAll('.tab-btn.active').forEach(el => {
      el.style.background = accent;
      el.style.color = isDark ? '#0d0d0d' : '#ffffff';
    });
    
    document.querySelectorAll('.btn-outline').forEach(el => {
      el.style.color = isDark ? '#e0e0e0' : '#444';
      el.style.borderColor = isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.15)';
      el.style.background = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.03)';
    });
    
    document.querySelectorAll('.recipe-card').forEach(el => {
      el.style.background = isDark ? '#222' : '#faf8f5';
      el.style.borderColor = isDark ? '#2a2a2a' : '#e0d6cc';
    });
    
    document.querySelectorAll('.form-control').forEach(el => {
      el.style.background = isDark ? '#1a1a1a' : '#faf8f5';
      el.style.color = isDark ? '#eee' : '#222';
      el.style.borderColor = isDark ? '#333' : '#d5d0ca';
    });
    
    const panel = document.getElementById('settingsPanel');
    if (panel) {
      panel.style.background = isDark ? '#1f1f1f' : '#ffffff';
      panel.style.color = isDark ? '#eee' : '#222';
      panel.style.borderColor = isDark ? '#2a2a2a' : '#e0d6cc';
    }
    
    document.querySelectorAll('.shopping-item').forEach(el => {
      el.style.borderBottomColor = isDark ? '#2a2a2a' : '#e8e0d8';
    });
    
    document.querySelector('.header').style.borderBottomColor = isDark ? '#2a2a2a' : '#e0d6cc';
    document.querySelector('.header h1').style.color = isDark ? '#eee' : '#222';
  }

  document.querySelectorAll('.color-option').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.color-option').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      settings.accentColor = btn.dataset.color;
      localStorage.setItem('cookbook_settings', JSON.stringify(settings));
      applySettings();
    });
  });

  document.getElementById('applyCustomColor').addEventListener('click', () => {
    const color = document.getElementById('customColorHex').value;
    if (color.match(/^#[0-9a-f]{6}$/i)) {
      document.querySelectorAll('.color-option').forEach(b => b.classList.remove('active'));
      settings.accentColor = color;
      localStorage.setItem('cookbook_settings', JSON.stringify(settings));
      applySettings();
    } else {
      alert('Enter a valid hex color (e.g., #f5a623)');
    }
  });

  document.getElementById('customColorPicker').addEventListener('input', (e) => {
    document.getElementById('customColorHex').value = e.target.value;
  });

  document.querySelectorAll('.font-option').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.font-option').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      settings.fontFamily = btn.dataset.font;
      localStorage.setItem('cookbook_settings', JSON.stringify(settings));
      document.getElementById('app').style.fontFamily = settings.fontFamily;
    });
  });

  document.getElementById('themeDark').addEventListener('click', () => {
    settings.theme = 'dark';
    localStorage.setItem('cookbook_settings', JSON.stringify(settings));
    applySettings();
  });

  document.getElementById('themeLight').addEventListener('click', () => {
    settings.theme = 'light';
    localStorage.setItem('cookbook_settings', JSON.stringify(settings));
    applySettings();
  });

  const radiusSlider = document.getElementById('radiusSlider');
  radiusSlider.addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    document.getElementById('radiusValue').textContent = val + 'px';
    settings.cardRadius = val;
    localStorage.setItem('cookbook_settings', JSON.stringify(settings));
    document.querySelectorAll('.recipe-card, .photo-upload-area, .macros-display, .settings-panel').forEach(el => {
      el.style.borderRadius = val + 'px';
    });
  });

  const fontSizeSlider = document.getElementById('fontSizeSlider');
  fontSizeSlider.addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    document.getElementById('fontSizeValue').textContent = val + '%';
    settings.fontSize = val;
    localStorage.setItem('cookbook_settings', JSON.stringify(settings));
    document.getElementById('app').style.fontSize = val + '%';
  });

  document.getElementById('resetSettings').addEventListener('click', () => {
    if (confirm('Reset all settings to defaults?')) {
      settings = { accentColor: '#f5a623', fontFamily: "'Helvetica Neue', system-ui, sans-serif", cardRadius: 20, fontSize: 100, theme: 'dark' };
      localStorage.setItem('cookbook_settings', JSON.stringify(settings));
      document.querySelectorAll('.color-option').forEach(b => b.classList.remove('active'));
      document.querySelector('.color-option[style*="#f5a623"]')?.classList.add('active');
      document.querySelectorAll('.font-option').forEach(b => b.classList.remove('active'));
      document.querySelector('.font-option[data-font*="Helvetica"]')?.classList.add('active');
      radiusSlider.value = 20;
      document.getElementById('radiusValue').textContent = '20px';
      fontSizeSlider.value = 100;
      document.getElementById('fontSizeValue').textContent = '100%';
      document.getElementById('customColorPicker').value = '#f5a623';
      document.getElementById('customColorHex').value = '#f5a623';
      applySettings();
    }
  });

  // Settings overlay
  document.getElementById('settingsToggle').addEventListener('click', () => {
    document.getElementById('settingsOverlay').classList.add('open');
    document.getElementById('customColorPicker').value = settings.accentColor;
    document.getElementById('customColorHex').value = settings.accentColor;
    document.getElementById('radiusSlider').value = settings.cardRadius;
    document.getElementById('radiusValue').textContent = settings.cardRadius + 'px';
    document.getElementById('fontSizeSlider').value = settings.fontSize;
    document.getElementById('fontSizeValue').textContent = settings.fontSize + '%';
  });

  document.getElementById('settingsClose').addEventListener('click', () => {
    document.getElementById('settingsOverlay').classList.remove('open');
  });

  document.getElementById('settingsOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('settingsOverlay')) {
      document.getElementById('settingsOverlay').classList.remove('open');
    }
  });

  // ============================================================
  // INIT
  // ============================================================

  applySettings();
  renderIngredientChips();
  
  document.querySelectorAll('.color-option').forEach(el => {
    if (el.dataset.color === settings.accentColor) el.classList.add('active');
  });
  document.querySelectorAll('.font-option').forEach(el => {
    if (el.dataset.font === settings.fontFamily) el.classList.add('active');
  });

  console.log('⚔️ KBCB - Firebase version loaded!');
</script>
